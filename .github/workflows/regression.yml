name: Deterministic Regression

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/regression.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "frontend/**"
      - ".github/workflows/regression.yml"
  workflow_dispatch:

jobs:
  deterministic-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run deterministic regression
        working-directory: frontend
        run: pnpm eval:deterministic
      - name: Upload eval diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-eval-report
          path: frontend/.artifacts/evals
          if-no-files-found: warn
