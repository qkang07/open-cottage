name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: frontend
        run: pnpm build
      - name: Package
        working-directory: frontend
        run: zip -r ../frontend-dist.zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist.zip

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: doc-site/pnpm-lock.yaml
      - name: Install
        working-directory: doc-site
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: doc-site
        run: pnpm build
      - name: Package
        working-directory: doc-site
        run: zip -r ../doc-site-dist.zip .vitepress/dist
      - uses: actions/upload-artifact@v4
        with:
          name: doc-site-dist
          path: doc-site-dist.zip

  build-service-go:
    strategy:
      matrix:
        include:
          - os: windows-latest
            output: cottage-service-go-windows-amd64.exe
            ldflags: -H=windowsgui
          - os: ubuntu-latest
            output: cottage-service-go-linux-amd64
          - os: macos-latest
            output: cottage-service-go-darwin-arm64
          - os: macos-13
            output: cottage-service-go-darwin-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cottage-service-go/go.mod
          cache-dependency-path: cottage-service-go/go.sum
      - name: Install Linux GTK deps (systray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - name: Build
        working-directory: cottage-service-go
        run: go build -ldflags="${{ matrix.ldflags }}" -o ${{ matrix.output }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: cottage-service-go/${{ matrix.output }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-frontend, build-docs, build-service-go]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/frontend-dist.zip
            artifacts/doc-site-dist.zip
            artifacts/cottage-service-go-*
